spring.application.name=asset_manager

# ===============================
# MySQL (Laragon)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/asset_mgmt
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

app.jwt.secret=THIS_IS_A_DEV_SECRET_CHANGE_ME_TO_64_CHARS_MINIMUM_1234567890ABCDEF
app.jwt.expiration-minutes=60

# ===== Password reset =====
app.reset.base-url=http://localhost:4200/change-password
app.reset.token-expiry-minutes=60

# ===== SMTP (fill with your real SMTP) =====
spring.mail.host=SMTP_HOST_HERE
spring.mail.port=587
spring.mail.username=YOUR_ACCOUNT@email.com
spring.mail.password=YOUR_APP_PASSWORD_OR_SMTP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=YOUR_ACCOUNT@email.com

# # ===============================
# # JPA / Hibernate
# # ===============================
# spring.jpa.hibernate.ddl-auto=none
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
