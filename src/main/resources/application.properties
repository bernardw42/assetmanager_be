# --- Security demo users (in-memory) ---
app.security.system-admin.username=system
app.security.system-admin.password=system123

app.security.asset-admin.username=asset
app.security.asset-admin.password=asset123

app.security.employee.username=employee
app.security.employee.password=employee123

